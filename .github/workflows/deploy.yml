name: Deploy to Azure AKS

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Run tests
        run: |
          python -m unittest discover -s src/tests

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure AKS
        run: |
          az deployment group create --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --template-file iac/main.bicep --parameters aksClusterName=${{ secrets.AKS_CLUSTER_NAME }} acrName=${{ secrets.ACR_NAME }} appImageName=${{ secrets.APP_IMAGE_NAME }} appImageTag=${{ secrets.APP_IMAGE_TAG }}
